# Local hosting by default: both ports bind to 127.0.0.1 only.
#   docker compose up -d --build     catalog on :4180, site on :4181
#
# To host on a tailnet, set LTS_BIND to this host's Tailscale IP (in the shell, or in a `.env`
# beside this file; `.env.example` shows the form). Never set it to 0.0.0.0: that publishes both
# ports on every interface of the host.
services:
  web:
    build: .
    image: luminosi-ts-web:local
    ports:
      - "${LTS_BIND:-127.0.0.1}:4180:8080"
      - "${LTS_BIND:-127.0.0.1}:4181:8081"
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    tmpfs:
      - /config:mode=1777
      - /data:mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
