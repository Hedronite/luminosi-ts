name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: bun install --frozen-lockfile
      - run: bun run icons:check
      - run: bun run typecheck
      - run: bun run build
      - run: bun run objects:check
      - run: bun run looks:check
      - run: bun run validate
      - name: Forge tests (img-to-object, Python standard library only)
        run: python3 --version && bun run forge:test
      - name: Install Nushell 0.108.0 (pinned, checksum-verified) for the skill tests
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nu.tar.gz" https://github.com/nushell/nushell/releases/download/0.108.0/nu-0.108.0-x86_64-unknown-linux-gnu.tar.gz
          echo "f0daaa0256b0f7dd5f4d9925b4d5522d8de5e947ed9ad64a43526e5cffeb05df  $RUNNER_TEMP/nu.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nu.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nu-0.108.0-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - run: bun run test
        env:
          LUMIN_REQUIRE_NU: "1"
      - run: bun run lint
      - run: bun run boundaries
      - run: bun run knip
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e

  # The image builds from source and serves both apps; the e2e suite runs against it. Nothing is
  # pushed to a registry.
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - run: docker compose up -d --build --wait
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run e2e:container
      - if: always()
        run: docker compose logs && docker compose down
