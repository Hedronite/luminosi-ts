name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. Runs on main always finish.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Jobs run side by side: static, unit, forge, the loose golden check, and the browser suites in shards. `check` and `container`
# are the required statuses (ruleset 27350458); each is a plain aggregate over the jobs behind it.
#
# Caches: the Bun package store (key: bun.lock), Turborepo's local cache (.turbo; the newest entry of the
# job restores, and Turborepo reuses whatever its own hashes still match) and the Playwright browsers.
# Jobs that never read assets/vendor check it out sparse (everything except that folder).
jobs:
  static:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-static-${{ github.sha }}
          restore-keys: turbo-static-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('assets/vendor/*/vendor.json') }}
          restore-keys: vendor-${{ runner.os }}-
      - run: bun run vendor:fetch
      - run: bun run icons:check
      - run: bun run icons:packs:check
      - run: bun run vendor:check
      - run: bun run solids:check
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run boundaries
      - run: bun run knip

  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-unit-${{ github.sha }}
          restore-keys: turbo-unit-
      - run: bun install --frozen-lockfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .vendor
          key: vendor-${{ runner.os }}-${{ hashFiles('assets/vendor/*/vendor.json') }}
          restore-keys: vendor-${{ runner.os }}-
      - run: bun run vendor:fetch
      - run: bun run build
      - run: bun run objects:check
      - run: bun run looks:check
      - run: bun run validate
      - name: Install Nushell 0.108.0 (pinned, checksum-verified) for the skill tests
        run: |
          curl -fsSL -o "$RUNNER_TEMP/nu.tar.gz" https://github.com/nushell/nushell/releases/download/0.108.0/nu-0.108.0-x86_64-unknown-linux-gnu.tar.gz
          echo "f0daaa0256b0f7dd5f4d9925b4d5522d8de5e947ed9ad64a43526e5cffeb05df  $RUNNER_TEMP/nu.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/nu.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/nu-0.108.0-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - run: bun run test
        env:
          LUMIN_REQUIRE_NU: "1"

  # The vendored forge's own tests: Python standard library only, no dependencies to install.
  forge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/assets/vendor/
          sparse-checkout-cone-mode: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - name: Forge tests (img-to-object, Python standard library only)
        run: python3 --version && bun run forge:test

  # The browser suite against the built catalog and site, in six shards (the accessibility specs alone are over a
  # quarter of the suite's run time, so fewer shards leave one of them well behind the rest).
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/assets/vendor/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-e2e-${{ matrix.shard }}-${{ github.sha }}
          restore-keys: turbo-e2e-${{ matrix.shard }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - run: bun run build
      # Playwright lists the specs only after a build (they import built packages), so the plan is checked here, once, and not in `static`.
      - if: matrix.shard == 1
        run: bun run shards:check
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Run this shard's tests (the list is in e2e/shards/plan.json)
        run: bunx playwright test $(bun e2e/shards/plan.ts args ${{ matrix.shard }})
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # The loose golden check: each 3D asset (and, after it, each scene fixture of the round trip) drawn by the still-frame rig on software WebGL (no GPU here) and compared coarsely
  # with the golden image a GPU made for it (e2e/golden), and four plants (a blank canvas, a recoloured subject, a missing part,
  # a moved camera) that it must fail. The strict check, which needs the GPU, never runs here: see STACK.md, "Golden images".
  golden:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/assets/vendor/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo
          key: turbo-golden-${{ github.sha }}
          restore-keys: turbo-golden-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bun install --frozen-lockfile
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - run: bun run e2e:golden:loose
      # What each asset measured, for setting and checking the bars (e2e/golden/metrics.ts).
      - if: always()
        run: for f in test-results/golden/loose/*.json; do cat "$f"; done
      # The round trip's loose check: each scene fixture drawn through createScene on software WebGL against its scene golden
      # (e2e/scenes), with the same four plants and margin. Its own report directory, because Playwright empties test-results on a run.
      - if: always()
        run: bun run e2e:scenes:loose
        env:
          GOLDEN_REPORT: ${{ runner.temp }}/scenes-report
      - if: always()
        run: for f in "$RUNNER_TEMP"/scenes-report/loose/*.json; do cat "$f"; done
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: golden-report
          path: |
            playwright-report
            test-results/golden
          retention-days: 7

  # The image builds from source and serves both apps; the same suite runs against it, in six shards.
  # Nothing is pushed to a registry.
  container-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            /*
            !/assets/vendor/
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.4
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: browsers
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: docker compose up -d --build --wait
      - run: bun install --frozen-lockfile
      - if: steps.browsers.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.browsers.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Run this shard's tests (the list is in e2e/shards/plan.json)
        run: bunx playwright test $(bun e2e/shards/plan.ts args ${{ matrix.shard }})
        env:
          E2E_CATALOG_URL: http://localhost:4180
          E2E_SITE_URL: http://localhost:4181
      - if: always()
        run: docker compose logs && docker compose down
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: container-report-${{ matrix.shard }}
          path: playwright-report
          retention-days: 7

  # Required statuses. Each passes only when every job behind it succeeded.
  check:
    if: always()
    needs: [static, unit, forge, e2e, golden]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done

  container:
    if: always()
    needs: [container-e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "needs: $RESULTS"
          for result in $RESULTS; do [ "$result" = success ] || exit 1; done
