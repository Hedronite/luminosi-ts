<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Aether Bloom — Raw WebGL2</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02030d;
      overscroll-behavior: none;
      touch-action: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #error {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: none;
      place-items: center;
      padding: 24px;
      color: #f5f2ff;
      background: #070812;
      font: 14px/1.55 system-ui, sans-serif;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <canvas id="gl" aria-label="A slowly breathing translucent cosmic flower"></canvas>
  <div id="error"></div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('gl');
      const errorElement = document.getElementById('error');

      function fail(message) {
        errorElement.style.display = 'grid';
        errorElement.textContent = message;
      }

      try {
        const gl = canvas.getContext('webgl2', {
          alpha: false,
          antialias: false,
          depth: false,
          stencil: false,
          desynchronized: true,
          powerPreference: 'high-performance',
          preserveDrawingBuffer: false
        });

        if (!gl) {
          throw new Error('WebGL 2 is unavailable in this browser.');
        }

        const vertexSource = `#version 300 es
          precision highp float;

          const vec2 POSITIONS[3] = vec2[3](
            vec2(-1.0, -1.0),
            vec2( 3.0, -1.0),
            vec2(-1.0,  3.0)
          );

          void main() {
            gl_Position = vec4(POSITIONS[gl_VertexID], 0.0, 1.0);
          }
        `;

        const fragmentSource = `#version 300 es
          precision highp float;
          precision highp int;

          uniform float uTime;
          uniform vec2 uResolution;
          uniform vec2 uPointer;
          uniform float uQuality;

          out vec4 fragColor;

          const float PI = 3.141592653589793;
          const float TAU = 6.283185307179586;
          const int MARCH_STEPS = 28;

          float hash11(float p) {
            p = fract(p * 0.1031);
            p *= p + 33.33;
            p *= p + p;
            return fract(p);
          }

          vec2 rotate2D(vec2 p, float a) {
            float c = cos(a);
            float s = sin(a);
            return vec2(c * p.x - s * p.y, s * p.x + c * p.y);
          }

          float smoothUnion(float a, float b, float k) {
            float safeK = max(k, 1e-4);
            float h = clamp(0.5 + 0.5 * (b - a) / safeK, 0.0, 1.0);
            return mix(b, a, h) - safeK * h * (1.0 - h);
          }

          float petalLayer(
            vec3 p,
            float count,
            float radialStart,
            float petalLength,
            float widthScale,
            float thicknessScale,
            float angleOffset,
            float layer,
            float neighbour,
            out vec4 petalData
          ) {
            float sectorSize = TAU / count;
            float theta = atan(p.y, p.x) - angleOffset;
            float sectorPosition = theta / sectorSize;
            float baseSector = floor(sectorPosition + 0.5);
            float localSector = sectorPosition - baseSector;
            float sector =
              baseSector +
              neighbour *
              (localSector < 0.0 ? -1.0 : 1.0);
            float id = mod(sector, count) + layer * 9.0;
            float phase = TAU * hash11(id * 11.73 + 0.91);
            float h1 = hash11(id * 17.17 + 2.3);
            float h2 = hash11(id * 29.41 + 4.7);
            float h3 = hash11(id * 43.03 + 8.9);

            float independentTwist =
              0.105 * sin(uTime * (0.44 + 0.080 * h2) + phase);

            float angle =
              sector * sectorSize +
              angleOffset +
              (h1 - 0.5) * 0.105 +
              independentTwist;

            vec2 radial = vec2(cos(angle), sin(angle));
            vec2 tangent = vec2(-radial.y, radial.x);
            vec3 q = vec3(dot(p.xy, radial), dot(p.xy, tangent), p.z);

            float breathing =
              1.0 +
              0.100 * sin(uTime * (0.58 + 0.08 * h3) + phase);

            float lengthVariation =
              petalLength *
              (0.88 + 0.22 * h1) *
              breathing;

            float n = clamp((q.x - radialStart) / lengthVariation, 0.0, 1.0);
            float arch = max(sin(PI * n), 0.0);
            float tip = n * n;
            float opening = sin(uTime * 0.56 + phase);

            float largeCurl =
              (h2 - 0.5) * widthScale * 0.52 * arch +
              widthScale * 0.17 *
                sin(n * (2.15 + h3) + phase * 0.55) *
                arch +
              widthScale * 0.120 *
                sin(uTime * 0.45 + phase + n * 2.4) *
                tip;

            float liftedTip =
              (h1 - 0.5) * thicknessScale * 1.1 +
              thicknessScale * (0.46 + 0.58 * h2) *
                sin(n * PI * 0.86 + phase * 0.38) *
                arch +
              thicknessScale * (1.55 + 0.72 * h3) * tip * opening;

            q.y -= largeCurl;
            q.z -= liftedTip;

            float twist =
              (h3 - 0.5) * (1.42 + 0.48 * layer) * n +
              0.44 * sin(uTime * 0.48 + phase + n * PI);

            q.yz = rotate2D(q.yz, twist);

            float foldPhase =
              n * (2.2 + h2) * PI +
              q.y * (7.5 + 1.4 * layer) +
              phase +
              uTime * (0.18 + 0.040 * h1);

            float foldWave =
              thicknessScale *
              (0.16 + 0.07 * h1) *
              arch *
              sin(foldPhase);

            q.z += foldWave;

            float width =
              widthScale *
              (0.115 + 0.89 * pow(arch, 0.68)) *
              (1.0 - 0.10 * n) *
              (0.97 + 0.03 * breathing);

            float thickness =
              thicknessScale *
              (0.27 + 0.78 * pow(arch, 0.88)) *
              (
                0.91 +
                0.09 *
                sin(
                  n * 3.0 * PI +
                  phase +
                  uTime * 0.33
                )
              );

            width = max(width, 0.035);
            thickness = max(thickness, 0.025);

            float crossDistance =
              (length(vec2(q.y / width, q.z / thickness)) - 1.0) *
              min(width, thickness);

            float capDistance = max(
              radialStart - q.x,
              q.x - radialStart - lengthVariation
            );

            float distanceValue = max(crossDistance, capDistance * 0.72);

            float fineRipple =
              0.0042 * arch *
                sin(23.0 * n + q.y * 13.0 + phase + uTime * 0.11) +
              0.0022 * arch *
                sin(37.0 * n - q.y * 8.0 + phase * 1.7);

            distanceValue += fineRipple;

            float bodyMask =
              smoothstep(0.035, 0.17, n) *
              smoothstep(0.035, 0.15, 1.0 - n);

            float fold =
              (
                0.5 +
                0.5 *
                sin(
                  foldPhase +
                  q.y / width * 1.35
                )
              ) * bodyMask;

            petalData = vec4(
              id,
              n,
              clamp(q.y / width, -1.35, 1.35),
              fold
            );
            return distanceValue;
          }

          float filament(
            vec3 p,
            float angle,
            float phase,
            float startRadius,
            float endRadius
          ) {
            vec2 axis = vec2(cos(angle), sin(angle));
            vec2 tangent = vec2(-axis.y, axis.x);
            vec3 q = vec3(dot(p.xy, axis), dot(p.xy, tangent), p.z);

            q.y -=
              0.15 *
              sin(q.x * 1.75 + phase + uTime * 0.38);

            q.z -=
              0.10 *
              sin(q.x * 1.3 + phase * 1.4 - uTime * 0.29);

            float threadDistance =
              length(q.yz) -
              (0.007 + 0.0015 * sin(phase));

            float capDistance = max(
              startRadius - q.x,
              q.x - endRadius
            );

            return max(threadDistance, capDistance * 0.72);
          }

          vec4 bloomField(vec3 p, out vec4 data) {
            vec4 outerData;
            vec4 innerDataA;
            vec4 innerDataB;

            float outer = petalLayer(
              p,
              7.0,
              0.34,
              2.02,
              0.66,
              0.145,
              0.02,
              0.0,
              0.0,
              outerData
            );

            float radialSquared = dot(p.xy, p.xy);
            float petalDistance = outer;
            data = outerData;
            float nearestRaw = outer;

            if (radialSquared < 2.60) {
              float innerA = petalLayer(
                p,
                6.0,
                0.20,
                1.20,
                0.41,
                0.115,
                0.28,
                1.0,
                0.0,
                innerDataA
              );

              petalDistance = smoothUnion(
                petalDistance,
                innerA,
                0.038
              );

              if (innerA < nearestRaw) {
                nearestRaw = innerA;
                data = innerDataA;
              }
            }

            if (radialSquared < 1.30) {
              float innerB = petalLayer(
                p,
                5.0,
                0.12,
                0.76,
                0.29,
                0.095,
                -0.20,
                2.0,
                0.0,
                innerDataB
              );

              petalDistance = smoothUnion(
                petalDistance,
                innerB,
                0.030
              );

              if (innerB < nearestRaw) {
                nearestRaw = innerB;
                data = innerDataB;
              }
            }

            float coreBreath = 1.0 + 0.080 * sin(uTime * 0.64);
            vec3 coreP = p;
            coreP.z +=
              0.030 *
              sin(p.x * 3.1 - p.y * 2.4 + uTime * 0.29);

            float coreDistance =
              (
                length(
                  coreP /
                  (vec3(0.57, 0.52, 0.40) * coreBreath)
                ) -
                1.0
              ) * 0.35;

            coreDistance +=
              0.008 *
              sin(
                atan(coreP.y, coreP.x) * 9.0 +
                coreP.z * 7.0 +
                uTime * 0.21
              );

            float filamentDistance = 50.0;

            if (dot(p.xy, p.xy) > 1.35) {
              filamentDistance = min(
                filament(p, 0.70, 0.4, 1.35, 2.75),
                filament(p, 2.82, 2.7, 1.52, 2.92)
              );

              filamentDistance = min(
                filamentDistance,
                filament(p, 5.05, 4.8, 1.44, 2.68)
              );
            }

            return vec4(
              petalDistance,
              coreDistance,
              filamentDistance,
              nearestRaw
            );
          }

          vec3 palette(
            float id,
            float rayDepth,
            float iterationTone,
            float fold
          ) {
            vec3 cyan = vec3(0.03, 0.72, 1.28);
            vec3 periwinkle = vec3(0.30, 0.38, 1.16);
            vec3 lavender = vec3(0.68, 0.34, 1.08);
            vec3 orchid = vec3(1.02, 0.08, 0.72);

            float petalTone = hash11(floor(id) * 8.31 + 2.4);
            vec3 cool = mix(cyan, periwinkle, petalTone);
            vec3 warm = mix(lavender, orchid, 0.28 + 0.24 * iterationTone);

            return mix(
              cool,
              warm,
              clamp(
                0.16 +
                rayDepth * 0.34 +
                fold * 0.28,
                0.0,
                0.78
              )
            );
          }

          vec3 veinTexture(vec2 coordinates, float phase) {
            vec2 warped =
              coordinates +
              0.34 *
              vec2(
                sin(coordinates.y * 0.72 + phase),
                sin(coordinates.x * 0.57 - phase * 0.83)
              );

            float primary =
              sin(
                warped.x +
                1.08 * sin(warped.y * 0.66 + phase)
              );

            float secondary =
              sin(
                warped.y * 0.94 -
                0.82 * sin(warped.x * 0.52 - phase)
              );

            float veinField = primary * secondary;

            float coarseWeb =
              1.0 -
              smoothstep(0.022, 0.115, abs(veinField));

            float fineWeb = 0.0;

            if (uQuality > 0.5) {
              float fineField =
                sin(
                  warped.x * 1.34 +
                  warped.y * 0.91 +
                  phase * 0.38
                );

              fineWeb =
                1.0 -
                smoothstep(0.012, 0.050, abs(fineField));

              fineWeb *= 0.12;
            }

            float polyp =
              coarseWeb * coarseWeb * coarseWeb *
              (
                0.5 +
                0.5 *
                sin(
                  warped.x * 2.1 -
                  warped.y * 1.6 +
                  phase
                )
              );

            return vec3(coarseWeb, fineWeb, polyp);
          }

          void main() {
            vec2 uv =
              (gl_FragCoord.xy * 2.0 - uResolution.xy) /
              max(uResolution.y, 1.0);

            float aspect =
              uResolution.x / max(uResolution.y, 1.0);

            uv.y +=
              0.07 *
              smoothstep(1.0, 1.5, aspect);

            float portraitMargin = mix(
              0.94,
              1.06,
              smoothstep(0.58, 0.82, aspect)
            );

            float portraitFit =
              max(
                1.0,
                portraitMargin / max(aspect, 0.5)
              );

            vec3 rayOrigin = vec3(0.0, 0.0, 5.15);
            vec3 rayDirection = normalize(
              vec3(uv * (0.60 * portraitFit), -1.0)
            );

            float yaw =
              uPointer.x * 0.052 +
              0.018 * sin(uTime * 0.15);

            float pitch =
              -uPointer.y * 0.043 +
              0.013 * sin(uTime * 0.12 + 1.2);

            rayOrigin.xz = rotate2D(rayOrigin.xz, yaw);
            rayDirection.xz = rotate2D(rayDirection.xz, yaw);
            rayOrigin.yz = rotate2D(rayOrigin.yz, pitch);
            rayDirection.yz = rotate2D(rayDirection.yz, pitch);

            float screenRadius = dot(uv, uv);
            float vignette =
              1.0 - 0.34 * smoothstep(0.55, 2.9, screenRadius);

            vec3 background = mix(
              vec3(0.002, 0.004, 0.017),
              vec3(0.022, 0.012, 0.060),
              clamp(0.58 - uv.y * 0.17, 0.0, 1.0)
            );

            background +=
              vec3(0.018, 0.025, 0.078) *
              exp(-screenRadius * 1.65);

            background +=
              vec3(0.010, 0.004, 0.028) *
              (
                0.5 +
                0.5 *
                sin(
                  uv.x * 1.7 -
                  uv.y * 1.1 +
                  uTime * 0.10
                )
              ) *
              exp(-screenRadius * 0.85);

            background *= vignette;

            vec3 accumulated = vec3(0.0);
            vec3 diffuseGlow = vec3(0.0);
            float transmittance = 1.0;

            float boundingRadius = 3.08;
            float b = dot(rayOrigin, rayDirection);
            float h =
              b * b -
              dot(rayOrigin, rayOrigin) +
              boundingRadius * boundingRadius;

            if (h > 0.0) {
              float root = sqrt(max(h, 0.0));
              float travel = max(0.0, -b - root);
              float farTravel = -b + root;

              for (int i = 0; i < MARCH_STEPS; i++) {
                if (
                  float(i) >= mix(22.0, 28.0, uQuality) ||
                  travel > farTravel ||
                  transmittance < 0.022
                ) {
                  break;
                }

                vec3 world = rayOrigin + rayDirection * travel;

                vec3 p = world;
                p +=
                  0.026 *
                  sin(
                    world.yzx * 1.32 +
                    vec3(0.4, 2.2, 4.1) +
                    uTime * 0.15
                  );

                p +=
                  0.012 *
                  sin(
                    world.zxy * 2.66 +
                    vec3(3.1, 0.8, 1.7) -
                    uTime * 0.105
                  );

                p +=
                  0.005 *
                  sin(
                    world.yxz * 4.9 +
                    vec3(1.3, 4.2, 2.6) +
                    uTime * 0.035
                  );

                vec4 petalData;
                vec4 field = bloomField(p, petalData);

                float petalDistance = field.x;
                float coreDistance = field.y;
                float filamentDistance = field.z;

                float surface =
                  exp(-abs(petalDistance) * 32.0);

                float innerMist =
                  exp(-abs(petalDistance) * 8.0);

                float petalInterior =
                  1.0 -
                  smoothstep(-0.060, 0.018, petalDistance);

                float depthTone =
                  0.5 +
                  0.5 *
                  sin(
                    travel * 1.14 +
                    petalData.x * 0.71 +
                    uTime * 0.68
                  );

                float iterationTone =
                  0.5 +
                  0.5 *
                  sin(
                    float(i) * 0.31 -
                    travel * 0.43 +
                    uTime * 0.52
                  );

                vec3 petalColour = palette(
                  petalData.x,
                  depthTone,
                  iterationTone,
                  petalData.w
                );

                vec3 pearl = vec3(0.58, 0.82, 1.0);
                vec3 champagne = vec3(1.0, 0.73, 0.39);

                vec3 harmonicSpectrum =
                  vec3(0.83) +
                  0.17 *
                  cos(
                    vec3(0.2, 2.25, 4.35) +
                    travel * 1.42 +
                    float(i) * 0.18 -
                    uTime * 0.56 +
                    petalData.x * 0.47
                  );

                petalColour *= harmonicSpectrum;

                vec2 veinCoordinates = vec2(
                  petalData.y * 6.55,
                  petalData.z * 2.55
                );

                float veinPhase =
                  petalData.x * 1.63 +
                  p.z * 5.2 +
                  uTime * 0.035;

                vec3 veinPattern = veinTexture(
                  veinCoordinates,
                  veinPhase
                );

                float veinWeb = clamp(
                  veinPattern.x * 0.92 +
                  veinPattern.y * 0.20,
                  0.0,
                  1.0
                );

                float edgeFrame = clamp(
                  smoothstep(0.72, 1.02, abs(petalData.z)) +
                  smoothstep(0.88, 0.99, petalData.y),
                  0.0,
                  1.0
                );

                float porousMask = clamp(
                  veinWeb * 0.94 +
                  edgeFrame * 0.72,
                  0.0,
                  1.0
                );

                float neonCore = pow(
                  clamp(veinWeb, 0.0, 1.0),
                  2.25
                );

                float neonHalo = pow(
                  clamp(
                    veinPattern.x * 0.74 +
                    veinPattern.y * 0.20,
                    0.0,
                    1.0
                  ),
                  0.68
                );

                vec3 neonColour = mix(
                  vec3(0.015, 0.82, 1.42),
                  vec3(0.82, 0.025, 1.18),
                  0.5 +
                  0.5 *
                  sin(
                    petalData.x * 0.91 +
                    petalData.y * 8.0 -
                    uTime * 0.24
                  )
                );

                float energyWave =
                  0.5 +
                  0.5 *
                  sin(
                    petalData.y * 22.0 +
                    petalData.z * 2.6 -
                    uTime * 2.45 +
                    petalData.x * 1.37
                  );

                float energyPulse = smoothstep(
                  0.70,
                  1.0,
                  energyWave
                );

                energyPulse *= energyPulse * neonCore;

                float energyWake =
                  smoothstep(0.20, 0.88, energyWave) *
                  neonHalo *
                  (1.0 - energyPulse * 0.35);

                vec3 energyColour = mix(
                  vec3(0.08, 1.08, 1.72),
                  vec3(1.10, 0.04, 1.42),
                  0.22 +
                  iterationTone * 0.68
                );

                float veinSurface =
                  surface *
                  porousMask;

                float membraneSurface =
                  surface *
                  (
                    0.42 +
                    0.100 * depthTone +
                    0.060 * petalInterior
                  );

                float veinVolume =
                  innerMist *
                  (
                    veinPattern.x * 0.34 +
                    veinPattern.y * 0.15
                  );

                float rareGold = step(
                  0.94,
                  hash11(floor(petalData.x) * 15.2 + 37.1)
                );

                vec3 veinColour = mix(
                  petalColour,
                  vec3(0.02, 0.78, 1.0),
                  veinPattern.y * 0.42
                );

                vec3 petalEmission =
                  veinColour *
                  (
                    veinSurface * 1.72 +
                    veinVolume * 0.72
                  );

                petalEmission +=
                  petalColour *
                  membraneSurface *
                  (
                    0.58 +
                    0.16 * iterationTone
                  );

                petalEmission +=
                  neonColour *
                  (
                    surface *
                    (
                      neonCore * 2.35 +
                      neonHalo * 0.52
                    ) +
                    innerMist * neonCore * 0.34
                  );

                petalEmission +=
                  energyColour *
                  (
                    surface *
                    (
                      energyPulse * 4.60 +
                      energyWake * 0.62
                    ) +
                    innerMist * energyPulse * 0.64
                  );

                petalEmission +=
                  pearl *
                  surface *
                  edgeFrame *
                  (0.08 + 0.17 * depthTone);

                petalEmission +=
                  mix(
                    vec3(0.08, 0.66, 1.0),
                    vec3(0.88, 0.09, 0.65),
                    iterationTone
                  ) *
                  veinPattern.z *
                  surface *
                  1.05;

                petalEmission +=
                  mix(
                    vec3(0.08, 0.60, 1.0),
                    champagne,
                    rareGold
                  ) *
                  veinPattern.z *
                  surface *
                  mix(0.34, 0.82, rareGold);

                petalEmission +=
                  champagne *
                  veinPattern.z *
                  neonCore *
                  surface *
                  rareGold *
                  1.35;

                petalEmission +=
                  mix(
                    vec3(0.15, 0.33, 1.0),
                    vec3(0.88, 0.10, 0.62),
                    iterationTone
                  ) *
                  petalData.w *
                  veinSurface *
                  0.24;

                petalEmission +=
                  petalColour *
                  innerMist *
                  0.025;

                float petalDensity =
                  membraneSurface * 0.68 +
                  veinSurface * 0.62 +
                  veinVolume * 0.20 +
                  petalInterior * veinWeb * 0.040 +
                  surface * edgeFrame * 0.15;

                float coreSurface =
                  exp(-abs(coreDistance) * 29.0);

                float coreInterior =
                  1.0 -
                  smoothstep(-0.055, 0.012, coreDistance);

                float coreDensity =
                  coreSurface * 0.92 +
                  coreInterior * 3.70;

                vec3 coreEmission =
                  vec3(0.0012, 0.0010, 0.008) +
                  coreSurface *
                  vec3(0.034, 0.018, 0.082) *
                  (0.72 + 0.28 * sin(uTime * 0.41 + travel * 2.0));

                float filamentSurface =
                  exp(-abs(filamentDistance) * 78.0);

                float nearestDistance = min(
                  abs(petalDistance),
                  min(
                    abs(coreDistance),
                    abs(filamentDistance)
                  )
                );

                float stepLength = clamp(
                  nearestDistance * 0.47 + 0.016,
                  0.022,
                  0.18
                );

                float petalAlpha =
                  1.0 -
                  exp(-petalDensity * stepLength * 3.2);

                float coreAlpha =
                  1.0 -
                  exp(-coreDensity * stepLength * 1.18);

                float filamentAlpha =
                  1.0 -
                  exp(-filamentSurface * stepLength * 1.8);

                float sampleAlpha =
                  1.0 -
                  (1.0 - petalAlpha) *
                  (1.0 - coreAlpha) *
                  (1.0 - filamentAlpha);

                vec3 filamentColour = mix(
                  vec3(0.28, 0.69, 1.0),
                  vec3(0.76, 0.51, 0.96),
                  iterationTone
                );

                vec3 sampleColour =
                  (
                    petalEmission * petalAlpha +
                    coreEmission * coreAlpha +
                    filamentColour * filamentAlpha
                  ) /
                  max(sampleAlpha, 1e-5);

                accumulated +=
                  transmittance *
                  sampleColour *
                  sampleAlpha;

                float glowDenominator = max(
                  petalDistance * petalDistance + 0.005,
                  0.005
                );

                float inverseGlow =
                  min(0.115, 0.00062 / glowDenominator);

                diffuseGlow +=
                  transmittance *
                  mix(
                    mix(
                      petalColour,
                      neonColour,
                      0.74
                    ),
                    energyColour,
                    energyPulse * 0.86
                  ) *
                  inverseGlow *
                  stepLength *
                  (
                    0.08 +
                    neonHalo * 0.92 +
                    energyWake * 0.62 +
                    energyPulse * 1.42
                  ) *
                  (0.5 + 0.5 * depthTone);

                transmittance *= 1.0 - sampleAlpha;
                travel += stepLength;
              }
            }

            vec3 colour =
              accumulated * 1.12 +
              diffuseGlow * 1.65 +
              background * (0.52 + 0.48 * transmittance);

            colour +=
              vec3(0.012, 0.018, 0.058) *
              exp(-screenRadius * 3.0) *
              transmittance;

            colour = tanh(max(colour, vec3(0.0)) * 1.08);

            float luminance = dot(
              colour,
              vec3(0.2126, 0.7152, 0.0722)
            );

            colour = mix(
              vec3(luminance),
              colour,
              1.34
            );

            colour = pow(max(colour, vec3(0.0)), vec3(0.92));
            colour *= vignette;

            fragColor = vec4(colour, 1.0);
          }
        `;

        const postFragmentSource = `#version 300 es
          precision highp float;

          uniform sampler2D uScene;
          uniform vec2 uTexel;
          uniform float uPostTime;

          out vec4 fragColor;

          vec3 bloomTap(vec2 uv) {
            vec3 sampleColour = texture(uScene, uv).rgb;
            float peak = max(
              sampleColour.r,
              max(sampleColour.g, sampleColour.b)
            );

            float luminance = dot(
              sampleColour,
              vec3(0.2126, 0.7152, 0.0722)
            );

            float highlight = smoothstep(
              0.16,
              0.78,
              max(peak, luminance * 1.28)
            );

            return sampleColour * highlight;
          }

          void main() {
            vec2 uv = gl_FragCoord.xy * uTexel;
            vec3 base = texture(uScene, uv).rgb;

            vec2 nearOffset = uTexel * 2.25;
            vec2 midOffset = uTexel * 7.0;
            vec2 farOffset = uTexel * 16.0;

            vec3 bloom = vec3(0.0);

            bloom += bloomTap(uv + vec2( nearOffset.x, 0.0)) * 0.12;
            bloom += bloomTap(uv + vec2(-nearOffset.x, 0.0)) * 0.12;
            bloom += bloomTap(uv + vec2(0.0,  nearOffset.y)) * 0.12;
            bloom += bloomTap(uv + vec2(0.0, -nearOffset.y)) * 0.12;

            bloom += bloomTap(uv + vec2( midOffset.x,  midOffset.y)) * 0.10;
            bloom += bloomTap(uv + vec2(-midOffset.x,  midOffset.y)) * 0.10;
            bloom += bloomTap(uv + vec2( midOffset.x, -midOffset.y)) * 0.10;
            bloom += bloomTap(uv + vec2(-midOffset.x, -midOffset.y)) * 0.10;

            bloom += bloomTap(uv + vec2( farOffset.x, 0.0)) * 0.07;
            bloom += bloomTap(uv + vec2(-farOffset.x, 0.0)) * 0.07;
            bloom += bloomTap(uv + vec2(0.0,  farOffset.y)) * 0.07;
            bloom += bloomTap(uv + vec2(0.0, -farOffset.y)) * 0.07;

            vec2 chromaOffset =
              uTexel *
              (
                0.85 +
                0.12 * sin(uPostTime * 0.31)
              );

            vec3 spectralBase = vec3(
              texture(uScene, uv + chromaOffset).r,
              base.g,
              texture(uScene, uv - chromaOffset).b
            );

            vec3 colour =
              mix(base, spectralBase, 0.10) +
              bloom *
              (
                0.96 +
                0.05 * sin(uPostTime * 0.43)
              );

            colour += bloom * bloom * 0.24;
            colour = tanh(max(colour, vec3(0.0)) * 1.14);

            float luminance = dot(
              colour,
              vec3(0.2126, 0.7152, 0.0722)
            );

            colour = mix(
              vec3(luminance),
              colour,
              1.25
            );

            fragColor = vec4(
              pow(max(colour, vec3(0.0)), vec3(0.94)),
              1.0
            );
          }
        `;

        function compileShader(type, source) {
          const shader = gl.createShader(type);
          gl.shaderSource(shader, source);
          gl.compileShader(shader);

          if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
            const log = gl.getShaderInfoLog(shader) || 'Unknown shader compilation error.';
            gl.deleteShader(shader);
            throw new Error(log);
          }

          return shader;
        }

        const vertexShader = compileShader(gl.VERTEX_SHADER, vertexSource);
        const fragmentShader = compileShader(gl.FRAGMENT_SHADER, fragmentSource);
        const program = gl.createProgram();

        gl.attachShader(program, vertexShader);
        gl.attachShader(program, fragmentShader);
        gl.linkProgram(program);

        gl.deleteShader(vertexShader);
        gl.deleteShader(fragmentShader);

        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          const log = gl.getProgramInfoLog(program) || 'Unknown program link error.';
          gl.deleteProgram(program);
          throw new Error(log);
        }

        const postVertexShader = compileShader(gl.VERTEX_SHADER, vertexSource);
        const postFragmentShader = compileShader(
          gl.FRAGMENT_SHADER,
          postFragmentSource
        );
        const postProgram = gl.createProgram();

        gl.attachShader(postProgram, postVertexShader);
        gl.attachShader(postProgram, postFragmentShader);
        gl.linkProgram(postProgram);

        gl.deleteShader(postVertexShader);
        gl.deleteShader(postFragmentShader);

        if (!gl.getProgramParameter(postProgram, gl.LINK_STATUS)) {
          const log =
            gl.getProgramInfoLog(postProgram) ||
            'Unknown post-processing program link error.';
          gl.deleteProgram(postProgram);
          throw new Error(log);
        }

        const timeLocation = gl.getUniformLocation(program, 'uTime');
        const resolutionLocation = gl.getUniformLocation(program, 'uResolution');
        const pointerLocation = gl.getUniformLocation(program, 'uPointer');
        const qualityLocation = gl.getUniformLocation(program, 'uQuality');
        const postSceneLocation = gl.getUniformLocation(postProgram, 'uScene');
        const postTexelLocation = gl.getUniformLocation(postProgram, 'uTexel');
        const postTimeLocation = gl.getUniformLocation(postProgram, 'uPostTime');

        const sceneTexture = gl.createTexture();
        const sceneFramebuffer = gl.createFramebuffer();

        if (!sceneTexture || !sceneFramebuffer) {
          throw new Error('Unable to create the post-processing buffers.');
        }

        gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.bindTexture(gl.TEXTURE_2D, null);

        const vertexArray = gl.createVertexArray();
        gl.bindVertexArray(vertexArray);
        gl.useProgram(program);

        gl.disable(gl.BLEND);
        gl.disable(gl.DEPTH_TEST);
        gl.disable(gl.CULL_FACE);

        const pointerTarget = new Float32Array(2);
        const pointerDamped = new Float32Array(2);

        function updatePointer(clientX, clientY) {
          pointerTarget[0] =
            clientX / Math.max(window.innerWidth, 1) * 2 - 1;
          pointerTarget[1] =
            1 - clientY / Math.max(window.innerHeight, 1) * 2;
        }

        window.addEventListener('pointermove', (event) => {
          updatePointer(event.clientX, event.clientY);
        }, { passive: true });

        window.addEventListener('pointerleave', () => {
          pointerTarget[0] = 0;
          pointerTarget[1] = 0;
        }, { passive: true });

        window.addEventListener('blur', () => {
          pointerTarget[0] = 0;
          pointerTarget[1] = 0;
        }, { passive: true });

        let renderScale = 1;
        let frameAverage = 16.7;
        let sampleFrames = 0;
        let lastResizeWidth = 0;
        let lastResizeHeight = 0;
        let deviceQuality = 1;
        let shaderQuality = 1;

        function resize(force = false) {
          const compact =
            window.matchMedia('(max-width: 760px)').matches;

          const mobile =
            compact ||
            window.matchMedia('(pointer: coarse)').matches;

          deviceQuality =
            mobile || (window.devicePixelRatio || 1) > 1.1
              ? 0
              : 1;
          shaderQuality = Math.min(
            shaderQuality,
            deviceQuality
          );

          const dprCap = mobile ? 0.80 : 0.90;
          const pixelBudget = mobile ? 420000 : 900000;
          const areaRatio = Math.sqrt(
            pixelBudget /
            Math.max(window.innerWidth * window.innerHeight, 1)
          );

          const pixelRatio = Math.min(
            Math.min(window.devicePixelRatio || 1, dprCap) * renderScale,
            areaRatio
          );

          const width = Math.max(1, Math.round(window.innerWidth * pixelRatio));
          const height = Math.max(1, Math.round(window.innerHeight * pixelRatio));

          if (
            force ||
            width !== lastResizeWidth ||
            height !== lastResizeHeight
          ) {
            lastResizeWidth = width;
            lastResizeHeight = height;
            canvas.width = width;
            canvas.height = height;

            gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
            gl.texImage2D(
              gl.TEXTURE_2D,
              0,
              gl.RGBA8,
              width,
              height,
              0,
              gl.RGBA,
              gl.UNSIGNED_BYTE,
              null
            );

            gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFramebuffer);
            gl.framebufferTexture2D(
              gl.FRAMEBUFFER,
              gl.COLOR_ATTACHMENT0,
              gl.TEXTURE_2D,
              sceneTexture,
              0
            );

            if (
              gl.checkFramebufferStatus(gl.FRAMEBUFFER) !==
              gl.FRAMEBUFFER_COMPLETE
            ) {
              throw new Error(
                'Unable to initialise the post-processing framebuffer.'
              );
            }

            gl.bindFramebuffer(gl.FRAMEBUFFER, null);
            gl.bindTexture(gl.TEXTURE_2D, null);
            gl.viewport(0, 0, width, height);
          }
        }

        window.addEventListener('resize', () => {
          resize(true);
        }, { passive: true });

        canvas.addEventListener('webglcontextlost', (event) => {
          event.preventDefault();
          fail(
            'The WebGL context was lost.\n\n' +
            'Reload the page to restart Aether Bloom.'
          );
        });

        resize(true);

        const startTime = performance.now();
        let previousTime = startTime;

        function render(now) {
          const deltaMs = Math.min(now - previousTime, 50);
          const deltaSeconds = deltaMs * 0.001;
          previousTime = now;

          frameAverage += (deltaMs - frameAverage) * 0.035;
          sampleFrames += 1;

          if (sampleFrames > 90) {
            let nextScale = renderScale;

            if (frameAverage > 22 && shaderQuality > 0.5) {
              shaderQuality = 0;
            } else if (frameAverage > 25 && renderScale > 0.72) {
              nextScale = Math.max(0.72, renderScale - 0.10);
            } else if (frameAverage < 16.4 && renderScale < 1) {
              nextScale = Math.min(1, renderScale + 0.05);
            }

            if (nextScale !== renderScale) {
              renderScale = nextScale;
              resize(true);
            }

            sampleFrames = 0;
          }

          const damping = 1 - Math.exp(-deltaSeconds * 4.5);
          pointerDamped[0] +=
            (pointerTarget[0] - pointerDamped[0]) * damping;
          pointerDamped[1] +=
            (pointerTarget[1] - pointerDamped[1]) * damping;

          const elapsedTime = (now - startTime) * 0.001;

          gl.bindFramebuffer(gl.FRAMEBUFFER, sceneFramebuffer);
          gl.viewport(0, 0, canvas.width, canvas.height);
          gl.useProgram(program);
          gl.bindVertexArray(vertexArray);
          gl.uniform1f(timeLocation, elapsedTime);
          gl.uniform2f(resolutionLocation, canvas.width, canvas.height);
          gl.uniform2fv(pointerLocation, pointerDamped);
          gl.uniform1f(qualityLocation, shaderQuality);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          gl.bindFramebuffer(gl.FRAMEBUFFER, null);
          gl.useProgram(postProgram);
          gl.activeTexture(gl.TEXTURE0);
          gl.bindTexture(gl.TEXTURE_2D, sceneTexture);
          gl.uniform1i(postSceneLocation, 0);
          gl.uniform2f(
            postTexelLocation,
            1 / Math.max(canvas.width, 1),
            1 / Math.max(canvas.height, 1)
          );
          gl.uniform1f(postTimeLocation, elapsedTime);
          gl.drawArrays(gl.TRIANGLES, 0, 3);

          requestAnimationFrame(render);
        }

        requestAnimationFrame(render);
      } catch (error) {
        console.error(error);
        fail(
          'Unable to start the raw WebGL artwork.\n\n' +
          (error instanceof Error ? error.message : String(error))
        );
      }
    })();
  </script>
</body>
</html>
